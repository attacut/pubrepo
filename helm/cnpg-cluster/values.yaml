# CloudNativePG PostgreSQL Cluster
nameOverride: ""
fullnameOverride: ""

cluster:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.2
  imagePullPolicy: IfNotPresent

storage:
  storageClass: "nfs-client"
  size: 40Gi

superuser:
  username: postgres
  password: ""  # Set password or leave empty to auto-generate
  secret: ""  # Use existing secret instead (if set, username/password above are ignored)

database:
  name: maindb
  owner: mainuser
  username: mainuser
  password: ""  # Set password or leave empty to auto-generate
  secret: ""  # Use existing secret instead (if set, username/password above are ignored)

resources:
  requests:
    memory: 500Mi
    cpu: 100m
  limits:
    memory: 1000Mi
    cpu: 500m

postgresql:
  parameters:
    max_connections: "100"
    shared_buffers: "256MB"

monitoring:
  enabled: false

backup:
  enabled: false
  retentionPolicy: "30d"
  barmanObjectStore:
    destinationPath: ""
    s3Credentials:
      accessKeyId:
        name: ""
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: ""
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip

scheduledBackup:
  enabled: false
  name: ""
  schedule: "0 2 * * *"
