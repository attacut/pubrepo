{{- if .Values.istioGateway.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ .Values.istioGateway.name | default (printf "%s-gateway" (include "gateway.name" .)) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "gateway.name" . }}
    {{- include "istio.labels" . | nindent 4}}
    {{- include "gateway.labels" . | nindent 4 }}
  annotations:
    {{- .Values.annotations | toYaml | nindent 4 }}
spec:
  selector:
    {{- if .Values.istioGateway.selector }}
    {{- toYaml .Values.istioGateway.selector | nindent 4 }}
    {{- else }}
    istio: {{ ($.Values.labels.istio | quote) | default (include "gateway.name" $ | trimPrefix "istio-") }}
    {{- end }}
  servers:
    {{- toYaml .Values.istioGateway.servers | nindent 4 }}
{{- end }}
