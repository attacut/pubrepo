---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql-ha
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    # Update with your repository URL
    repoURL: https://github.com/your-org/your-repo.git
    targetRevision: main
    path: helm/postgresql-ha
    
    helm:
      # Use vault-integrated values
      valueFiles:
        - values-vault.yaml
      
      # Optional: Override values
      values: |
        postgresql:
          database: "production_db"
        
        persistence:
          size: 50Gi
  
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  # Health assessment
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
