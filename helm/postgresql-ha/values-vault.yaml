# Example values for PostgreSQL HA with Vault Integration
# Copy this file and customize for your environment

## Global configuration
global:
  imageRegistry: ""
  defaultStorageClass: "nfs-client"

## PostgreSQL Configuration
postgresql:
  # Number of replicas for HA
  replicaCount: 3
  
  # Enable synchronous replication for data safety
  syncReplication: true
  
  # User configuration
  username: postgres
  database: "myapp"
  
  # Vault integration (ArgoCD Vault Plugin)
  vault:
    enabled: true
    path: "secret/data/postgresql-ha"
  
  # Reference to secret created by AVP
  existingSecret: "postgresql-ha-postgresql"
  
  # Resources
  resourcesPreset: "small"
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

## Pgpool Configuration
pgpool:
  # Number of replicas for HA
  replicaCount: 2
  
  # Admin user
  adminUsername: admin
  
  # Vault integration (ArgoCD Vault Plugin)
  vault:
    enabled: true
    path: "secret/data/pgpool"
  
  # Reference to secret created by AVP
  existingSecret: "postgresql-ha-pgpool"
  
  # Connection pooling settings
  numInitChildren: 32
  maxPool: 4
  childMaxConnections: 5
  
  # Resources
  resourcesPreset: "small"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

## Persistence
persistence:
  enabled: true
  storageClass: "nfs-client"
  size: 20Gi
  accessModes:
    - ReadWriteOnce

## Backup
backup:
  enabled: true
  cronjob:
    schedule: "@daily"
    storage:
      storageClass: "nfs-client"
      size: 10Gi

## Metrics (optional)
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    labels:
      prometheus: kube-prometheus

## Service configuration
service:
  type: ClusterIP
  ports:
    postgresql: 5432
