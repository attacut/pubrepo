apiVersion: v1
kind: Secret
metadata:
  name: gitlab-runner-secret
  namespace: default  # เปลี่ยน namespace ตามที่ต้องการ
type: Opaque
data:
  # Base64 encode ของ runner token ที่ได้จาก GitLab
  # ใช้คำสั่ง: echo -n "YOUR_ACTUAL_TOKEN" | base64
  runner-token: WU9VUl9HSVRMQUJfUlVOTkVSX1RPS0VOX0hFUkU=  # placeholder
  runner-registration-token: ""  # ใส่เป็นค่าว่างสำหรับ compatibility
